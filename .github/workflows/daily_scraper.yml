name: CRM Job Scraper Pipeline

on:
  schedule:
    - cron: '7 12 * * *' # 12:07 UTC (8:07 AM EDT / 7:07 AM EST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: search, filter and rank, but don't write to the sheet"
        type: boolean
        default: true
      test_scope:
        description: "What to search"
        type: choice
        options: [all, tier1]
        default: all
      tier2_group:
        description: "Tier 2 regions (auto = alternate A/B by date)"
        type: choice
        options: [auto, A, B, both, none]
        default: auto

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          # Scheduled runs are always live; manual runs default to a dry run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          TEST_SCOPE: ${{ inputs.test_scope || 'all' }}
          TIER2_GROUP: ${{ inputs.tier2_group != 'auto' && inputs.tier2_group || '' }}
        run: python daily_scraper.py

      - name: Upload daily exports (ranked leads + filtered-out log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exports-${{ github.run_id }}
          path: exports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit and Push Persistent CSV State
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f seen_jobs_master.csv ]; then
            git add seen_jobs_master.csv
            git diff --staged --quiet || git commit -m "chore: update seen jobs state tracker [skip ci]"
            git push
          else
            echo "No seen_jobs_master.csv was generated today. Nothing to commit."
          fi
