name: Daily Job Scraper Pipeline

on:
  schedule:
    - cron: '30 13 * * *' # 1:30 PM UTC (8:30 AM EST)
  workflow_dispatch:      # Allows you to click a button to run it manually

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest
    
    # Crucial permission required to allow the bot to commit the CSV back to the repo
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Scraper Script
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python daily_scraper.py
        
      - name: Commit and Push Persistent CSV State
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seen_jobs_master.csv
          # The || true ensures the workflow doesn't fail if there are no new jobs to commit
          git diff --staged --quiet || git commit -m "chore: update seen jobs state tracker [skip ci]"
          git push
