name: CRM Job Scraper Pipeline

on:
  schedule:
    - cron: '30 12 * * *' # 12:30 PM UTC (8:30 AM EDT)
  workflow_dispatch:      

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Scraper Script
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python daily_scraper.py
        
      - name: Commit and Push Persistent CSV State
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f seen_jobs_master.csv ]; then
            git add seen_jobs_master.csv
            git diff --staged --quiet || git commit -m "chore: update seen jobs state tracker [skip ci]"
            git push
          else
            echo "No seen_jobs_master.csv was generated today. Nothing to commit."
          fi
